name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test (SQLite), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  postgres:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cfpass
          POSTGRES_DB: corridor_finder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: cf
      DB_PASSWORD: cfpass
      DB_NAME: corridor_finder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
